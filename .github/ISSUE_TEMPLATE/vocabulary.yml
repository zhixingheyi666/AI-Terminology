name: 录入英文词汇
description: 填写单词和原句，由 DeepSeek 生成释义、翻译并保存到词库。
title: "[词汇录入] "
body:
  - type: markdown
    attributes:
      value: |
        仅仓库所有者提交的请求会自动处理。此表单和生成的词条均公开可见。
        请勿填写 API Key；密钥只需在仓库的 Actions Secrets 中设置一次。
  - type: input
    id: term
    attributes:
      label: 单词
      placeholder: fine-tuning
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: 英文原句
      description: 保留你实际遇到的英文句子。
      placeholder: By fine-tuning these models, we can create instruct or chat models that can follow directions.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 出处（可选）
      placeholder: 书名、文章标题或链接
  - type: dropdown
    id: analysis
    attributes:
      label: 详细分析
      description: 默认只录入释义、原句、翻译和词级笔记。
      options:
        - 普通录入（不分析句子）
        - 详细分析（包含语法和语境）
      default: 0
    validations:
      required: true
