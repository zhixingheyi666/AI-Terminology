name: Generate private vocabulary draft

on:
  repository_dispatch:
    types: [vocabulary-draft]

permissions: {}

concurrency:
  group: vocabulary-draft-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Do not put client_payload/request/key in YAML env or commands. GitHub
      # displays those values in step logs. The script reads the private event
      # file and passes only DRAFT_REQUEST and the DeepSeek key to its child.
      - name: Generate encrypted draft response
        id: response
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: node scripts/return-draft.mjs

      - name: Return safe failure if the workflow could not complete
        if: ${{ always() && steps.response.outcome != 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload;
            const owner = context.repo.owner.toLowerCase();
            if ([context.payload.sender?.login, context.actor, process.env.GITHUB_TRIGGERING_ACTOR].some(v => typeof v !== 'string' || v.toLowerCase() !== owner)) return;
            if (p?.version !== 1 || !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(p.request_id || '') || !/^[0-9a-f]{40}$/.test(p.head_sha || '')) return;
            const name = `vocabulary-draft-${p.request_id}`;
            const previous = await github.rest.checks.listForRef({ ...context.repo, ref: p.head_sha, check_name: name, filter: 'latest' });
            if (previous.data.check_runs.some(c => c.external_id === p.request_id && c.head_sha === p.head_sha && c.app?.slug === 'github-actions' && c.status === 'completed')) return;
            await github.rest.checks.create({ ...context.repo, name, head_sha: p.head_sha, external_id: p.request_id,
              status: 'completed', conclusion: 'failure', output: { title: 'Vocabulary draft', summary: 'Draft generation did not complete.',
              text: JSON.stringify({ version: 1, request_id: p.request_id, error: 'WORKFLOW_FAILED' }) } });
