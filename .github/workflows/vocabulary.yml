name: Add vocabulary with DeepSeek

on:
  issues:
    types: [opened, reopened]

permissions: {}

# Different requests must not replace one another in a global pending slot.
concurrency:
  group: vocabulary-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[词汇录入]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      entry_id: ${{ steps.generate.outputs.entry_id }}
    steps:
      - name: Checkout current vocabulary
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests before using the API
        run: node --test

      - name: Generate and validate vocabulary
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: node scripts/generate-vocabulary.mjs

      - name: Validate complete library
        run: node scripts/validate-data.mjs

      - name: Save vocabulary
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/vocabulary.json
          if git diff --cached --quiet; then
            echo 'This request is already recorded; no additional commit needed.'
          else
            git commit -m "content: add vocabulary from issue #${ISSUE_NUMBER}"
            # Never overwrite a newer edit from another device or request.
            if ! git push origin HEAD:main; then
              echo 'The remote library changed. Re-run failed jobs to merge with the latest library.'
              exit 1
            fi
          fi
          printf '词条已保存到词库，正在等待网站发布。\n' >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN pushes do not trigger the separate push workflow.
  deploy:
    needs: generate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  result:
    needs: [generate, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show published entry
        env:
          ENTRY_ID: ${{ needs.generate.outputs.entry_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO_NAME="${REPOSITORY#*/}"
          printf '词条已保存并发布。\n\n[打开词条](https://%s.github.io/%s/#/entry/%s)\n' "$OWNER" "$REPO_NAME" "$ENTRY_ID" >> "$GITHUB_STEP_SUMMARY"
